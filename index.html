<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14212b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Whiteout — a downhill-skiing roguelike for phones. Something is chasing you." />
    <title>Whiteout</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;900&family=Bungee&family=Press+Start+2P&display=swap" />
  </head>
  <body>
    <div id="app">
      <canvas id="slope" aria-label="Ski slope"></canvas>
      <div id="frost" aria-hidden="true"></div>

      <header class="hud">
        <div class="hud-row">
          <div class="stat"><b id="dist">0</b><span id="length">m</span></div>
          <div class="stat"><b id="speed">0</b><span>m/s</span></div>
          <div class="stat style"><b id="style">0</b><span id="mult"></span></div>
          <button id="pause" class="icon-btn" aria-label="Pause">❚❚</button>
        </div>
        <div class="hud-row">
          <span class="stat slope-chip"><span id="trail" class="trail" title="Trail rating"></span><b id="slope-no">1-1</b></span>
          <div class="meter" role="meter" aria-label="Yeti distance" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="meter-fill" class="meter-fill"></div>
            <span class="meter-label" id="meter-label">quiet</span>
          </div>
        </div>
        <div class="hud-row snack-row" id="snacks" aria-label="Snacks"></div>
      </header>

      <div id="toasts" aria-live="polite"></div>

      <section id="overlay" class="overlay">
        <div class="card" id="card"></div>
      </section>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
