function normalizeSystemName(value){return String(value||"").replace(/系统$/u,"").replace(/[\s\-—–_·:：,，、/（）()]+/g,"").toLowerCase()}
function templateMatch(system){const explicit=String(system?.templateSystemId||"").toUpperCase();if(explicit){const t=arr(templates.systems).find(x=>x.id===explicit);return t?{status:"matched",template:t,matchedBy:"templateSystemId"}:{status:"unmatched",reason:`未知母版系统 ID：${explicit}`}}const name=normalizeSystemName(system?.name),hits=arr(templates.systems).filter(t=>[t.name,...arr(t.matchTerms)].some(term=>normalizeSystemName(term)===name));return hits.length===1?{status:"matched",template:hits[0],matchedBy:"unambiguous-name"}:hits.length>1?{status:"unmatched",reason:`系统名命中多个母版：${hits.map(x=>x.id).join("、")}`}:{status:"unmatched",reason:"母版中没有无歧义同名系统；请填写 templateSystemId"}}

function mdTable(columns,rows){if(!arr(columns).length)return"待补充";const c=v=>String(v??"").replace(/\|/g,"\\|").replace(/\n/g,"<br>"),head=`| ${columns.map(c).join(" | ")} |`,line=`| ${columns.map(()=>"---").join(" | ")} |`,body=arr(rows).map(row=>`| ${columns.map(col=>c(row[col])).join(" | ")} |`).join("\n");return`${head}\n${line}${body?`\n${body}`:""}`}
